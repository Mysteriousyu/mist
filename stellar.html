<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stellar</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stellar">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23111'/><circle cx='16' cy='16' r='6' fill='%23333'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#000;color:#e8e8e8;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#333;border-radius:10px}

/* ========== ORB LANDING ========== */
#orb-screen{
  position:fixed;inset:0;z-index:1000;background:#000;
  display:grid;place-items:center;
  transition:opacity .6s cubic-bezier(.4,0,.2,1),transform .6s cubic-bezier(.4,0,.2,1);
}
#orb-screen.leaving{opacity:0;transform:scale(1.2)}
#orb-screen.gone{display:none}

.orb-wrap{text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orb{
  width:180px;height:180px;border-radius:50%;margin:0 auto 32px;
  background:radial-gradient(circle at 38% 35%,#2a2a2a 0%,#1a1a1a 40%,#0a0a0a 70%,#000 100%);
  box-shadow:0 0 80px rgba(255,255,255,.04),0 0 160px rgba(255,255,255,.02),inset 0 -20px 40px rgba(255,255,255,.03);
  position:relative;
  animation:orbFloat 6s ease-in-out infinite;
  transition:transform .3s ease,box-shadow .3s ease;
}
.orb::before{
  content:'';position:absolute;top:15%;left:20%;width:35%;height:25%;border-radius:50%;
  background:radial-gradient(ellipse,rgba(255,255,255,.12) 0%,transparent 70%);
}
.orb::after{
  content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(255,255,255,.06);
}
.orb:hover{transform:scale(1.08);box-shadow:0 0 120px rgba(255,255,255,.08),0 0 200px rgba(255,255,255,.04),inset 0 -20px 40px rgba(255,255,255,.05)}
.orb:active{transform:scale(.95)}

@keyframes orbFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.orb-label{font-size:15px;color:#555;letter-spacing:.5px;font-weight:300;
  animation:labelPulse 3s ease-in-out infinite}
@keyframes labelPulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ========== BROWSER UI ========== */
#browser{
  display:flex;flex-direction:column;height:100dvh;
  opacity:0;transform:translateY(20px);
  transition:opacity .5s ease .2s,transform .5s ease .2s;
}
#browser.visible{opacity:1;transform:translateY(0)}

/* Tab bar */
.tab-bar{
  flex:none;display:flex;align-items:center;gap:0;
  background:#0a0a0a;border-bottom:1px solid #1a1a1a;
  padding:0 8px;height:42px;
}
.tabs-scroll{
  flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;
  scrollbar-width:none;padding:6px 0;
}
.tabs-scroll::-webkit-scrollbar{display:none}

.tab{
  flex:none;display:flex;align-items:center;gap:6px;
  padding:6px 12px;border-radius:8px;
  background:transparent;color:#888;font-size:12px;
  max-width:180px;transition:all .15s ease;white-space:nowrap;
}
.tab:hover{background:#1a1a1a;color:#ccc}
.tab.active{background:#1e1e1e;color:#fff}
.tab .tab-title{flex:1;overflow:hidden;text-overflow:ellipsis}
.tab .tab-close{
  width:16px;height:16px;display:grid;place-items:center;
  border-radius:4px;color:#666;font-size:10px;
  transition:all .1s ease;
}
.tab .tab-close:hover{background:#333;color:#fff}

.tab-new{
  flex:none;width:28px;height:28px;display:grid;place-items:center;
  border-radius:6px;color:#666;font-size:16px;
  transition:all .12s ease;
}
.tab-new:hover{background:#1a1a1a;color:#fff}

.tab-actions{
  flex:none;display:flex;align-items:center;gap:4px;
  padding-left:8px;border-left:1px solid #1a1a1a;margin-left:4px;
}
.tab-action{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:8px;color:#666;transition:all .12s ease;
}
.tab-action:hover{background:#1a1a1a;color:#fff}
.tab-action.translating{color:#4dabf7}

/* URL bar */
.url-bar{
  flex:none;display:flex;align-items:center;gap:8px;
  padding:6px 12px;background:#0a0a0a;border-bottom:1px solid #1a1a1a;
}
.url-input-wrap{
  flex:1;display:flex;align-items:center;gap:8px;
  background:#111;border:1px solid #222;border-radius:20px;
  padding:7px 14px;transition:border-color .15s ease;
}
.url-input-wrap:focus-within{border-color:#444}
.url-input-wrap svg{flex:none;color:#555}
.url-input-wrap input{flex:1;background:none;font-size:13px;color:#e8e8e8}
.url-input-wrap input::placeholder{color:#555}

.nav-btn{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:8px;color:#555;transition:all .12s ease;flex:none;
}
.nav-btn:hover{background:#1a1a1a;color:#fff}
.nav-btn:disabled{opacity:.25;cursor:not-allowed}

/* Main content area */
.browser-main{flex:1;position:relative;background:#111;min-height:0}

/* Iframe pages */
.page-frame{
  position:absolute;inset:0;width:100%;height:100%;border:0;
  background:#fff;display:none;
}
.page-frame.active{display:block}

/* New tab / home screen */
.home-screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 20px;
  background:radial-gradient(ellipse at 50% 30%,#0f0f0f 0%,#000 70%);
  overflow-y:auto;
}
.home-screen.hidden{display:none}

.home-search{
  width:100%;max-width:560px;margin-bottom:40px;
}
.home-search-box{
  display:flex;align-items:center;gap:10px;
  background:#111;border:1px solid #222;border-radius:24px;
  padding:12px 18px;transition:border-color .2s ease,box-shadow .2s ease;
}
.home-search-box:focus-within{
  border-color:#333;
  box-shadow:0 0 40px rgba(255,255,255,.03);
}
.home-search-box input{flex:1;background:none;font-size:15px;color:#e8e8e8}
.home-search-box input::placeholder{color:#555}
.home-search-box button{
  padding:6px 16px;border-radius:16px;
  background:#fff;color:#000;font-weight:600;font-size:12px;
  transition:all .12s ease;
}
.home-search-box button:hover{background:#ddd}

/* Shortcuts */
.shortcuts{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
  gap:12px;width:100%;max-width:560px;
}
.shortcut{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:16px 8px;border-radius:14px;
  background:#0f0f0f;border:1px solid #1a1a1a;
  transition:all .15s ease;cursor:pointer;
}
.shortcut:hover{border-color:#333;transform:translateY(-2px);background:#141414}
.shortcut .sc-icon{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;font-size:18px;font-weight:700;
  background:#1a1a1a;color:#888;
}
.shortcut .sc-name{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.shortcut.add-shortcut .sc-icon{
  background:transparent;border:1.5px dashed #333;color:#555;font-size:20px;
}

/* Translate overlay */
.translate-bar{
  position:absolute;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:rgba(10,10,10,.95);
  backdrop-filter:blur(12px);border-bottom:1px solid #222;
  transform:translateY(-100%);transition:transform .2s ease;
}
.translate-bar.open{transform:translateY(0)}
.translate-bar select{
  background:#1a1a1a;border:1px solid #333;border-radius:8px;
  padding:6px 10px;color:#e8e8e8;font-size:12px;
}
.translate-bar .translate-go{
  padding:6px 14px;border-radius:8px;
  background:#fff;color:#000;font-weight:600;font-size:12px;
}
.translate-bar .translate-close{
  margin-left:auto;color:#666;padding:4px;border-radius:6px;
}
.translate-bar .translate-close:hover{color:#fff}

/* Loading bar */
.loading-bar{
  position:absolute;top:0;left:0;height:2px;
  background:linear-gradient(90deg,#fff,#888);
  width:0;z-index:100;transition:width .3s ease;
  border-radius:0 1px 1px 0;
}
.loading-bar.loading{animation:loadProgress 2s ease-out forwards}
.loading-bar.done{width:100%;opacity:0;transition:opacity .3s ease .2s}
@keyframes loadProgress{0%{width:0}50%{width:60%}90%{width:85%}100%{width:92%}}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1a1a1a;border:1px solid #333;border-radius:12px;
  padding:10px 20px;font-size:13px;color:#e8e8e8;z-index:2000;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Add shortcut modal */
.modal-overlay{
  position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.7);
  display:none;place-items:center;backdrop-filter:blur(4px);
}
.modal-overlay.open{display:grid}
.modal{
  background:#111;border:1px solid #222;border-radius:16px;
  padding:24px;width:min(380px,90vw);
}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal input{
  width:100%;padding:10px 14px;background:#0a0a0a;border:1px solid #222;
  border-radius:10px;font-size:13px;color:#e8e8e8;margin-bottom:10px;
}
.modal input::placeholder{color:#555}
.modal input:focus{border-color:#444}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-actions button{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:500}
.modal-actions .cancel{color:#888}
.modal-actions .cancel:hover{color:#fff}
.modal-actions .save{background:#fff;color:#000}
.modal-actions .save:hover{background:#ddd}
</style>
</head>
<body>

<!-- ORB LANDING SCREEN -->
<div id="orb-screen">
  <div class="orb-wrap" onclick="enterBrowser()">
    <div class="orb"></div>
    <div class="orb-label">tap to enter</div>
  </div>
</div>

<!-- BROWSER UI -->
<div id="browser">
  <!-- Tab bar -->
  <div class="tab-bar">
    <div class="tabs-scroll" id="tabs"></div>
    <button class="tab-new" onclick="newTab()" title="New tab">+</button>
    <div class="tab-actions">
      <button class="tab-action" id="translateBtn" onclick="toggleTranslate()" title="Translate page">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2v3"/><path d="M22 22l-5-10-5 10"/><path d="M14 18h6"/></svg>
      </button>
    </div>
  </div>

  <!-- URL bar -->
  <div class="url-bar">
    <button class="nav-btn" id="backBtn" onclick="goBack()" disabled title="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <button class="nav-btn" id="fwdBtn" onclick="goForward()" disabled title="Forward">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
    </button>
    <button class="nav-btn" id="refreshBtn" onclick="refreshPage()" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9c2.49 0 4.74 1 6.36 2.64"/><path d="M21 3v6h-6"/></svg>
    </button>
    <div class="url-input-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="urlInput" placeholder="Search or enter URL" spellcheck="false"
        onkeydown="if(event.key==='Enter')navigate(this.value)">
    </div>
  </div>

  <!-- Main browser area -->
  <div class="browser-main" id="browserMain">
    <div class="loading-bar" id="loadingBar"></div>
    
    <!-- Translate bar -->
    <div class="translate-bar" id="translateBar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8l6 6"/><path d="M4 14l6-6 2-3"/><path d="M2 5h12"/><path d="M7 2v3"/></svg>
      <select id="translateLang">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="it">Italian</option>
      </select>
      <button class="translate-go" onclick="translatePage()">Translate</button>
      <button class="translate-close" onclick="toggleTranslate()">✕</button>
    </div>

    <!-- Home screen (new tab page) -->
    <div class="home-screen" id="homeScreen">
      <div class="home-search">
        <div class="home-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="homeSearchInput" placeholder="Search the web or enter a URL"
            onkeydown="if(event.key==='Enter')navigate(this.value)">
          <button onclick="navigate(document.getElementById('homeSearchInput').value)">Go</button>
        </div>
      </div>
      <div class="shortcuts" id="shortcuts"></div>
    </div>
  </div>
</div>

<!-- Add shortcut modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>Add shortcut</h3>
    <input type="text" id="scName" placeholder="Name (e.g. YouTube)">
    <input type="text" id="scUrl" placeholder="URL (e.g. youtube.com)">
    <div class="modal-actions">
      <button class="cancel" onclick="closeModal()">Cancel</button>
      <button class="save" onclick="saveShortcut()">Add</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ========== STATE ========== */
let tabs = [];
let activeTabId = null;
let tabCounter = 0;
let shortcuts = JSON.parse(localStorage.getItem('stellar-shortcuts') || 'null') || [
  { name: 'Google', url: 'https://google.com', letter: 'G' },
  { name: 'YouTube', url: 'https://youtube.com', letter: 'Y' },
  { name: 'GitHub', url: 'https://github.com', letter: 'GH' },
  { name: 'Reddit', url: 'https://reddit.com', letter: 'R' },
  { name: 'Wikipedia', url: 'https://wikipedia.org', letter: 'W' },
];

/* ========== ORB TRANSITION ========== */
function enterBrowser() {
  const orb = document.getElementById('orb-screen');
  orb.classList.add('leaving');
  setTimeout(() => {
    orb.classList.add('gone');
    document.getElementById('browser').classList.add('visible');
    newTab();
  }, 500);
}

/* ========== TABS ========== */
function newTab() {
  const id = ++tabCounter;
  tabs.push({ id, title: 'New Tab', url: '', history: [], historyIdx: -1 });
  switchTab(id);
  renderTabs();
  showHome(true);
  setTimeout(() => document.getElementById('homeSearchInput').focus(), 100);
}

function switchTab(id) {
  activeTabId = id;
  const tab = tabs.find(t => t.id === id);
  
  // Hide all frames and home screens
  document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
  
  if (tab.url) {
    showHome(false);
    const frame = document.getElementById('frame-' + id);
    if (frame) frame.classList.add('active');
    document.getElementById('urlInput').value = tab.url;
  } else {
    showHome(true);
    document.getElementById('urlInput').value = '';
  }
  
  updateNavButtons();
  renderTabs();
}

function closeTab(id, e) {
  if (e) e.stopPropagation();
  if (tabs.length === 1) return;
  
  const frame = document.getElementById('frame-' + id);
  if (frame) frame.remove();
  
  tabs = tabs.filter(t => t.id !== id);
  if (activeTabId === id) switchTab(tabs[tabs.length - 1].id);
  renderTabs();
}

function renderTabs() {
  const container = document.getElementById('tabs');
  container.innerHTML = tabs.map(t => 
    `<button class="tab ${t.id === activeTabId ? 'active' : ''}" onclick="switchTab(${t.id})">
      <span class="tab-title">${esc(t.title)}</span>
      ${tabs.length > 1 ? `<span class="tab-close" onclick="closeTab(${t.id},event)">✕</span>` : ''}
    </button>`
  ).join('');
}

/* ========== NAVIGATION ========== */
function navigate(input) {
  if (!input || !input.trim()) return;
  input = input.trim();
  
  let url;
  if (/^https?:\/\//i.test(input)) {
    url = input;
  } else if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(input)) {
    url = 'https://' + input;
  } else {
    url = 'https://www.google.com/search?q=' + encodeURIComponent(input);
  }
  
  loadUrl(url);
}

function proxyUrl(url) {
  return '/proxy?url=' + encodeURIComponent(url);
}

function loadUrl(url) {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab) return;
  
  tab.url = url;
  tab.title = extractTitle(url);
  tab.history = tab.history.slice(0, tab.historyIdx + 1);
  tab.history.push(url);
  tab.historyIdx = tab.history.length - 1;
  
  showHome(false);
  showLoading();
  
  let frame = document.getElementById('frame-' + tab.id);
  if (!frame) {
    frame = document.createElement('iframe');
    frame.id = 'frame-' + tab.id;
    frame.className = 'page-frame';
    frame.setAttribute('referrerpolicy', 'no-referrer');
    frame.onload = () => {
      hideLoading();
      try {
        const title = frame.contentDocument?.title;
        if (title) { tab.title = title; renderTabs(); }
      } catch(e) {}
    };
    frame.onerror = () => hideLoading();
    document.getElementById('browserMain').appendChild(frame);
  }
  
  document.querySelectorAll('.page-frame').forEach(f => f.classList.remove('active'));
  frame.classList.add('active');
  frame.src = proxyUrl(url);
  
  document.getElementById('urlInput').value = url;
  updateNavButtons();
  renderTabs();
}

function goBack() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || tab.historyIdx <= 0) return;
  tab.historyIdx--;
  const url = tab.history[tab.historyIdx];
  tab.url = url;
  tab.title = extractTitle(url);
  
  const frame = document.getElementById('frame-' + tab.id);
  if (frame) { showLoading(); frame.src = proxyUrl(url); frame.onload = () => hideLoading(); }
  document.getElementById('urlInput').value = url;
  updateNavButtons();
  renderTabs();
}

function goForward() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || tab.historyIdx >= tab.history.length - 1) return;
  tab.historyIdx++;
  const url = tab.history[tab.historyIdx];
  tab.url = url;
  tab.title = extractTitle(url);
  
  const frame = document.getElementById('frame-' + tab.id);
  if (frame) { showLoading(); frame.src = proxyUrl(url); frame.onload = () => hideLoading(); }
  document.getElementById('urlInput').value = url;
  updateNavButtons();
  renderTabs();
}

function refreshPage() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || !tab.url) return;
  const frame = document.getElementById('frame-' + tab.id);
  if (frame) { showLoading(); frame.src = proxyUrl(tab.url); frame.onload = () => hideLoading(); }
}

function updateNavButtons() {
  const tab = tabs.find(t => t.id === activeTabId);
  document.getElementById('backBtn').disabled = !tab || tab.historyIdx <= 0;
  document.getElementById('fwdBtn').disabled = !tab || tab.historyIdx >= tab.history.length - 1;
}

/* ========== HOME SCREEN ========== */
function showHome(show) {
  document.getElementById('homeScreen').classList.toggle('hidden', !show);
}

function renderShortcuts() {
  const grid = document.getElementById('shortcuts');
  grid.innerHTML = shortcuts.map((s, i) => 
    `<div class="shortcut" onclick="navigate('${esc(s.url)}')">
      <div class="sc-icon">${esc(s.letter)}</div>
      <div class="sc-name">${esc(s.name)}</div>
    </div>`
  ).join('') +
  `<div class="shortcut add-shortcut" onclick="openModal()">
    <div class="sc-icon">+</div>
    <div class="sc-name">Add</div>
  </div>`;
}

/* ========== TRANSLATE ========== */
function toggleTranslate() {
  const bar = document.getElementById('translateBar');
  const btn = document.getElementById('translateBtn');
  bar.classList.toggle('open');
  btn.classList.toggle('translating');
}

function translatePage() {
  const tab = tabs.find(t => t.id === activeTabId);
  if (!tab || !tab.url) { toast('Open a page first'); return; }
  const lang = document.getElementById('translateLang').value;
  const translateUrl = 'https://translate.google.com/translate?sl=auto&tl=' + lang + '&u=' + encodeURIComponent(tab.url);
  // Load translate URL directly (Google Translate works in iframes)
  const frame = document.getElementById('frame-' + tab.id);
  if (frame) { showLoading(); frame.src = translateUrl; frame.onload = () => hideLoading(); }
  toggleTranslate();
  toast('Translating to ' + document.getElementById('translateLang').selectedOptions[0].text);
}

/* ========== SHORTCUTS MODAL ========== */
function openModal() {
  document.getElementById('addModal').classList.add('open');
  document.getElementById('scName').value = '';
  document.getElementById('scUrl').value = '';
  setTimeout(() => document.getElementById('scName').focus(), 100);
}

function closeModal() {
  document.getElementById('addModal').classList.remove('open');
}

function saveShortcut() {
  const name = document.getElementById('scName').value.trim();
  let url = document.getElementById('scUrl').value.trim();
  if (!name || !url) { toast('Fill in both fields'); return; }
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const letter = name.slice(0, 2).toUpperCase();
  shortcuts.push({ name, url, letter });
  localStorage.setItem('stellar-shortcuts', JSON.stringify(shortcuts));
  renderShortcuts();
  closeModal();
  toast('Shortcut added');
}

/* ========== LOADING BAR ========== */
function showLoading() {
  const bar = document.getElementById('loadingBar');
  bar.className = 'loading-bar';
  void bar.offsetWidth;
  bar.classList.add('loading');
}

function hideLoading() {
  const bar = document.getElementById('loadingBar');
  bar.classList.remove('loading');
  bar.classList.add('done');
  setTimeout(() => { bar.className = 'loading-bar'; }, 500);
}

/* ========== HELPERS ========== */
function extractTitle(url) {
  try {
    const u = new URL(url);
    let host = u.hostname.replace('www.', '');
    if (u.pathname !== '/' && u.pathname.length > 1) {
      const path = u.pathname.split('/').filter(Boolean).pop() || '';
      if (path) host += ' — ' + decodeURIComponent(path).replace(/[-_]/g, ' ');
    }
    return host.charAt(0).toUpperCase() + host.slice(1);
  } catch { return url.slice(0, 30); }
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

/* Close modal on overlay click */
document.getElementById('addModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* Listen for navigation messages from proxied pages */
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'stellar-navigate' && e.data.url) {
    loadUrl(e.data.url);
  }
});

/* ========== INIT ========== */
renderShortcuts();
</script>
</body>
</html>
